<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi carta - Giovanni Dazarola</title>
    <link rel="stylesheet" href="assets/estilos.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="carta">
        <h1>Giovanni Dazarola</h1>
        <h2 class="clase">Frontend</h2>

        <div class="avatar">🧙‍♂️</div> <!-- o imagen si prefieres -->

        <div class="estadisticas">
            <h3>Estadísticas</h3>
            <div>HTML <div class="barra"><div style="width: 80%;"></div></div></div>
            <div>CSS <div class="barra"><div style="width: 70%;"></div></div></div>
            <div>JavaScript <div class="barra"><div style="width: 60%;"></div></div></div>
        </div>

        <div class="habilidad">
            <h3>Habilidad especial</h3>
            <p><strong>Pixel Perfect</strong>: Maquetado milimétrico sin depender de frameworks</p>
        </div>

        <div class="rareza">Rara</div>

        <button id="btn-activar">Activar habilidad</button>
        <p>Activaciones: <span id="contador">0</span></p>
    </div>

    <script src="assets/script.js"></script>
</body>
</html>
